[package]
name = "opendm40"
version = "0.3.1"
edition = "2021"
description = "Replacement firmware for the Alientek DM40 (GD32F427)"

[[bin]]
name = "opendm40"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = true
panic = "abort"

[profile.dev]
opt-level = "z"
panic = "abort"

[features]
default = ["vdisk", "ad2-isr"]
# Leave the panel contents alone at start (no clear, status squares only on
# failure) so a screenshot captures what the previous firmware last drew.
keep-screen = []
# AD2 logger stream on ONE timer interrupt (TIMER6 = STM32 TIM7, IRQ 55) with
# the HY3131 bus handed to the ISR exclusively while an AD2 session runs
# (../docs/history/decisions-2026-10-22.md #3; src/hy3131.rs `stream`, src/logger.rs
# `isr`, src/ad2pll.rs). DEFAULT since the device check of 4b98128 (lost 0 at
# 4800 / 9600 / 19200 S/s, 60 s each; docs/dmm-input-scope-feasibility.md 11).
# Without it (--no-default-features --features vdisk) the build has no
# interrupt at all and the AD2 logger is the main-loop sampler.
ad2-isr = []
# USB mass-storage LUN = the read-only information volume generated from the
# MCU memory and the SPI-disk files (src/vdisk.rs: LOGS / SCOPE / SHOTS /
# INFO / DEBUG). Default; without it the LUN is the writable SPI disk.
vdisk = []
# fatren (src/fatren.rs: after a boot, rename the installed dm40*.bin on the
# SPI FAT to _DM40PRV.BIN; its exact condition is owned by fatren.rs) only
# reports what it would do.
fatren-dry-run = []
# Recovery alternatives for tests (default recovery = zero the 12-byte loader
# marker at 0x08008000 + reset -> vendor loader update screen + USB disk):
#   recovery-file: 0-byte DM40RCVR.BIN on the SPI FAT + power off (needs a cold
#     boot with the key held long enough to reach the loader);
#   recovery-usb: our own minimal USB mass-storage disk (no LCD).
recovery-file = []
recovery-usb = []
# Test builds next to a sleeping owner: the buzzer never sounds (every beep,
# the danger alarm and the power-off warning at duty 0; the continuity / diode
# beeper's CMP pin buffer, HY3131 R20 bit 2, off; the boot key-hold cue
# silent). Not for releases.
mute = []

[dependencies]
cortex-m = "0.7.7"
# critical_section::with (synopsys-usb-otg's endpoint buffers) WITHOUT masking
# interrupts: src/main.rs `NoMask` (the AD2 stream ISR shares no state with it).
critical-section = "1.2.0"
synopsys-usb-otg = { version = "0.5.0", features = ["fs"] }
usb-device = "0.3.2"
usbd-storage = { version = "3.0.0", features = ["bbb", "scsi"] }

# usbd-storage 3.0.0 with five fixes (vendor/usbd-storage, each marked
# "dm40 patch"; device check f3aea2f 6b: a host's reset recovery ended in a
# panic -> watchdog reset): no SCSI callback in Command Transfer Invalid (the
# previous command's pass / fail panicked in `set_status`), the IO buffer
# cleared at every reset, Bulk-Only Mass Storage Reset handled (a control
# OUT; the crate looked for it in control IN), never more IN data than the
# host asked for, `Scsi::sending` (msc.rs pumps the fill / CSW).
[patch.crates-io]
usbd-storage = { path = "vendor/usbd-storage" }
