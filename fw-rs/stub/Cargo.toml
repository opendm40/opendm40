[package]
name = "dm40-stub"
version = "0.1.0"
edition = "2021"
description = "RAM stub: programs dm40-fw into internal flash sector 8 and starts it"

[[bin]]
name = "dm40-stub"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = true

[profile.dev]
panic = "abort"

[workspace]
