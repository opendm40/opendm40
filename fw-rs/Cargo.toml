[package]
name = "dm40-fw"
version = "0.0.1"
edition = "2021"
description = "Replacement firmware for the Alientek DM40 (GD32F427)"

[[bin]]
name = "dm40-fw"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = true
panic = "abort"

[profile.dev]
opt-level = "z"
panic = "abort"

[features]
default = ["vdisk"]
# Leave the panel contents alone at start (no clear, status squares only on
# failure) so a screenshot captures what the previous firmware last drew.
keep-screen = []
# AD2 logger stream on ONE timer interrupt (TIMER6 = STM32 TIM7, IRQ 55) with
# the HY3131 bus handed to the ISR exclusively while a LOG:SOURce AD2 session
# runs (docs/decisions-2026-10-22.md #3; src/hy3131.rs `stream`, src/logger.rs
# `isr`). Off by default until the device acceptance (LOG:COUNt? lost = 0 at
# 4800 S/s for 60 s with DBG:AD2:DRAW 2); without it the build has no
# interrupt at all and the AD2 logger is the main-loop sampler.
ad2-isr = []
# USB mass-storage LUN = the read-only information volume generated from the
# MCU memory and the SPI-disk files (src/vdisk.rs: LOGS / SCOPE / SHOTS /
# INFO / DEBUG). Default; without it the LUN is the writable SPI disk.
vdisk = []
# fatren (src/fatren.rs: after a boot, rename the installed dm40*.bin on the
# SPI FAT to _DM40PRV.BIN; its exact condition is owned by fatren.rs) only
# reports what it would do.
fatren-dry-run = []
# Recovery alternatives for tests (default recovery = zero the 12-byte loader
# marker at 0x08008000 + reset -> vendor loader update screen + USB disk):
#   recovery-file: 0-byte DM40RCVR.BIN on the SPI FAT + power off (needs a cold
#     boot with the key held long enough to reach the loader);
#   recovery-usb: our own minimal USB mass-storage disk (no LCD).
recovery-file = []
recovery-usb = []

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
synopsys-usb-otg = { version = "0.5.0", features = ["fs"] }
usb-device = "0.3.2"
usbd-storage = { version = "3.0.0", features = ["bbb", "scsi"] }
