# After CI on a pull request: a comment on the PR with its test build
# (download links, SHA-256, commit; firmware/README.md "PR builds").
# CI (ci.yml, pull_request) builds the PR's code with a read-only token and
# uploads the image as an artifact. This workflow has the write permission
# and never checks out or runs PR code: it runs tools/pr-build-comment.sh
# from the default branch, which only reads the artifact as data.
# workflow_run starts only the default branch's copy of this file;
# workflow_dispatch (a CI run id) re-posts by hand.
name: PR build

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: CI run id (a pull_request run)
        required: true

permissions:
  actions: read # the CI run's artifacts
  pull-requests: write # the comment
  contents: read

concurrency:
  group: pr-build-${{ github.event.workflow_run.head_sha || inputs.run_id }}

jobs:
  comment:
    name: Comment the test build
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      # The workflow's own commit (the default branch for workflow_run), not
      # the PR's.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: firmware/tools/pr-build-comment.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: tools/pr-build-comment.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: firmware/tools/pr-build-comment.sh "$RUN_ID"
